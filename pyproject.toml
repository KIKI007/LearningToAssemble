[project]
name = "learn2assemble"
version = "0.0.1"
authors = [
  { name="Ziqi Wang", email="ziqiw@ust.hk" },
]
dependencies = [
    "wandb",
    "torch_geometric == 2.6.1",
    "scipy==1.14.1",
    'shapely',
    'gurobipy',
    'torch>=2.6.0',
    "torchvision>=0.21.0",
    "numpy == 1.26.4",
    "polyscope",
    "trimesh",
    "python-fcl",
    "matplotlib",
    "pytest"
]


description = "A package for conducting research using robots for assembly"
readme = "README.md"
requires-python = ">=3.10"
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]

[tool.hatch.build.targets.wheel]
ignore-vcs = true
packages = ["src/learn2assemble"]
include = ["src/**"]

[build-system]
requires = ["hatchling >= 1.27.0"]
build-backend = "hatchling.build"

[project.urls]
Homepage = "https://github.com/kiki007/LearningToAssemble"
Issues = "https://github.com/kiki007/LearningToAssemble/issues"

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu124", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]